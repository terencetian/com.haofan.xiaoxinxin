<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="f-bg" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#62B0F8"/>
      <stop offset="1" stop-color="#2C71D8"/>
    </linearGradient>
    <clipPath id="f-sq">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#f-sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#f-bg)"/>

    <!-- 左右各一半：左半微提亮、右半微压暗，中缝一条极淡的线 -->
    <rect x="100" y="100" width="412" height="824" fill="#FFFFFF" fill-opacity="0.05"/>
    <rect x="512" y="100" width="412" height="824" fill="#08182E" fill-opacity="0.04"/>
    <path d="M512 312 L512 712" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4"/>

    <!-- 左半：人民币符号 -->
    <g stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M226 368 L306 462"/>
      <path d="M386 368 L306 462"/>
      <path d="M306 462 L306 664"/>
      <path d="M240 526 L372 526"/>
      <path d="M240 600 L372 600"/>
    </g>

    <!-- 右半：沙漏（上下横梁 + 交叉腰身，线框） -->
    <g stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M640 362 L796 362"/>
      <path d="M640 662 L796 662"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="42" stroke-linecap="round" fill="none">
      <path d="M656 388 L780 636"/>
      <path d="M780 388 L656 636"/>
    </g>
  </g>
</svg>
